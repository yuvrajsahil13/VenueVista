spring.application.name=eventvista

spring.datasource.url=jdbc:mysql://localhost:3306/eventvista?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ---------- Razorpay (Test Mode) ----------
# Leave empty to use the built-in demo payment screen.
razorpay.key-id=
razorpay.key-secret=

# ---------- E-ticket emails (Gmail) ----------
# Set to true and fill username + 16-char Gmail App Password to email tickets.
app.mail.enabled=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.config.import=optional:classpath:secrets.properties
